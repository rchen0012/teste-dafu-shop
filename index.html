<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>大福面单 · 手机版</title>
    <style>
        /* ===== 全局重置 & 移动优先 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0ABAB5 0%, #008E9B 100%);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            padding: 18px 16px 28px;
            margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8f0f0;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-image {
            height: 32px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
        }

        .logo-text h1 {
            font-size: 17px;
            font-weight: 700;
            color: #1e1e2a;
            line-height: 1.2;
        }

        .logo-text .subtitle {
            font-size: 10px;
            color: #888;
            font-weight: 400;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .nav-tab {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            background: #f0f6f6;
            color: #666;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            border: none;
        }

        .nav-tab.active {
            background: #0ABAB5;
            color: white;
            box-shadow: 0 4px 10px rgba(10, 186, 181, 0.25);
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ===== 表单区域 ===== */
        .form-section {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e1e2a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #0ABAB5;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        label .required {
            color: #ff4757;
            margin-left: 2px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0ecec;
            border-radius: 14px;
            font-size: 16px;
            background: white;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
            color: #1e1e2a;
        }

        input:focus {
            outline: none;
            border-color: #0ABAB5;
            box-shadow: 0 0 0 4px rgba(10, 186, 181, 0.12);
        }

        input.error {
            border-color: #ff4757;
        }

        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* ===== 按钮 ===== */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .btn {
            flex: 1;
            padding: 16px 10px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            touch-action: manipulation;
        }

        .btn-primary {
            background: #0ABAB5;
            color: white;
            box-shadow: 0 6px 16px rgba(10, 186, 181, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.96);
            background: #008E9B;
        }

        .btn-primary:disabled {
            background: #ccc;
            box-shadow: none;
            transform: none;
            opacity: 0.6;
        }

        .btn-secondary {
            background: #e8f0f0;
            color: #0ABAB5;
        }

        .btn-secondary:active {
            background: #d0e6e6;
            transform: scale(0.96);
        }

        .btn-success {
            background: #28a745;
            color: white;
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.25);
        }
        .btn-success:active {
            transform: scale(0.96);
            background: #1e7e34;
        }

        .btn-warning {
            background: #ffc107;
            color: #1e1e2a;
            box-shadow: 0 6px 16px rgba(255, 193, 7, 0.25);
        }
        .btn-warning:active {
            transform: scale(0.96);
            background: #e0a800;
        }

        .btn-print-guide {
            background: #17a2b8;
            color: white;
            box-shadow: 0 6px 16px rgba(23, 162, 184, 0.25);
            flex: 0 0 auto;
            padding: 16px 20px;
        }
        .btn-print-guide:active {
            transform: scale(0.96);
            background: #138496;
        }

        /* ===== 预览页面 ===== */
        .preview-page {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .preview-header .back-btn {
            background: none;
            border: none;
            color: #0ABAB5;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .preview-header .back-btn:active {
            opacity: 0.6;
        }

        .preview-header .info-badge {
            font-size: 13px;
            color: #666;
            background: white;
            padding: 4px 14px;
            border-radius: 30px;
        }

        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-bottom: 8px;
        }

        /* ===== 标签预览卡片 ===== */
        .label-card {
            background: white;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 16px 18px;
            position: relative;
            font-family: Arial, sans-serif;
            min-height: 150px;
            flex-shrink: 0;
        }

        .label-card .preview-logo1 {
            height: 28px;
            width: auto;
            object-fit: contain;
            display: inline-block;
        }

        .label-card .preview-order {
            font-size: 22px;
            font-weight: bold;
            margin: 6px 0 4px;
            color: #1e1e2a;
        }

        .label-card .preview-divider {
            border-top: 2px dashed #ccc;
            margin: 8px 0;
        }

        .label-card .preview-field {
            font-size: 14px;
            margin: 4px 0;
            color: #1e1e2a;
        }

        .label-card .preview-field.store-field {
            font-size: 20px;
            font-weight: bold;
            color: #0a2a3a;
        }

        .label-card .preview-page-indicator {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            opacity: 0.7;
            text-align: center;
            margin-top: 6px;
        }

        .preview-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .preview-actions .btn {
            flex: 1;
            min-width: 80px;
        }

        /* ===== 历史记录 ===== */
        .history-section {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .history-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            border-left: 4px solid #0ABAB5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .history-order {
            font-weight: 600;
            color: #1e1e2a;
            font-size: 15px;
        }

        .history-customer {
            color: #666;
            font-size: 14px;
            margin-top: 2px;
        }

        .history-meta {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e2a;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
            z-index: 999;
            animation: slideDown 0.35s ease;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ===== 打印页面 - 独立全屏 ===== */
        .print-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f5f5f5;
            z-index: 9999;
            padding: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .print-page.show {
            display: block;
        }

        .print-page .print-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px 0;
            background: #f5f5f5;
            position: sticky;
            top: 0;
            z-index: 10;
            gap: 12px;
            flex-wrap: wrap;
        }

        .print-page .print-toolbar .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .print-page .print-toolbar .title {
            font-size: 16px;
            font-weight: 700;
            color: #1e1e2a;
        }

        .print-page .print-toolbar button {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .print-page .print-toolbar .btn-close {
            background: #e8f0f0;
            color: #0ABAB5;
        }
        .print-page .print-toolbar .btn-close:active {
            background: #d0e6e6;
        }

        .print-page .print-toolbar .btn-print-now {
            background: #0ABAB5;
            color: white;
            box-shadow: 0 4px 12px rgba(10, 186, 181, 0.3);
        }
        .print-page .print-toolbar .btn-print-now:active {
            transform: scale(0.96);
            background: #008E9B;
        }

        .print-page .print-toolbar .btn-share-print {
            background: #ffc107;
            color: #1e1e2a;
        }
        .print-page .print-toolbar .btn-share-print:active {
            transform: scale(0.96);
            background: #e0a800;
        }

        .print-page .print-label-wrapper {
            display: flex;
            justify-content: center;
            padding: 10px 0 30px 0;
        }

        .print-page .print-label {
            width: 100mm;
            height: 150mm;
            border: 2px solid #000;
            padding: 7mm;
            background: white;
            font-family: Arial, sans-serif;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
        }

        .print-page .print-label .preview-logo1 {
            height: 12mm;
            width: auto;
            object-fit: contain;
            display: inline-block;
        }

        .print-page .print-label .preview-order {
            font-size: 11mm;
            font-weight: bold;
            margin: 4mm 0 3mm 0;
            color: #1e1e2a;
        }

        .print-page .print-label .preview-divider {
            border-top: 1mm dashed #ccc;
            margin: 3mm 0;
        }

        .print-page .print-label .preview-field {
            font-size: 5.5mm;
            margin: 2mm 0;
            color: #1e1e2a;
        }

        .print-page .print-label .preview-field.store-field {
            font-size: 9mm;
            font-weight: bold;
            color: #0a2a3a;
            margin: 3mm 0;
        }

        .print-page .print-label .preview-page-indicator {
            position: absolute;
            bottom: 6mm;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16mm;
            font-weight: bold;
            color: #1a1a1a;
            opacity: 0.7;
        }

        .print-page .print-tip {
            text-align: center;
            padding: 16px 20px;
            color: #666;
            font-size: 14px;
            background: white;
            border-radius: 12px;
            margin: 0 0 16px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            line-height: 1.6;
        }

        .print-page .print-tip strong {
            color: #0ABAB5;
        }

        .print-page .print-tip .icon {
            font-size: 20px;
        }

        /* ===== 打印样式 ===== */
        @media print {
            .print-page .print-toolbar,
            .print-page .print-tip {
                display: none !important;
            }
            .print-page {
                background: white !important;
                padding: 0 !important;
            }
            .print-page .print-label-wrapper {
                padding: 0 !important;
            }
            .print-page .print-label {
                margin: 0 auto;
                border: 2px solid #000;
                page-break-after: always;
                box-shadow: none !important;
            }
            body .app-container {
                display: none !important;
            }
            .print-page {
                display: block !important;
                position: static !important;
            }
        }

        /* ===== 工具 ===== */
        .hidden {
            display: none !important;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="logo">
                <img src="images/form-logonova.png" alt="dafu pano Logo" class="logo-image">
                <div class="logo-text">
                    <h1>面单打印小程序</h1>
                    <div class="subtitle">DAFU Label Printing System</div>
                </div>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="create" onclick="switchTab('create')">标签</button>
                <button class="nav-tab" data-tab="history" onclick="switchTab('history')">记录</button>
            </div>
        </header>

        <!-- ===== 页面：创建标签 ===== -->
        <div id="pageCreate" class="page active">
            <div class="form-section">
                <div class="section-title">订单信息</div>

                <div class="form-group">
                    <label>货号 <span class="required">*</span></label>
                    <input type="text" id="orderNo" placeholder="输入货号" maxlength="20">
                    <div class="error-message" id="orderNoError">请输入货号</div>
                </div>

                <div class="form-group">
                    <label>金额 <span class="required">*</span></label>
                    <input type="number" id="amount" placeholder="输入金额" step="0.01" min="0">
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="generateLabel()" id="generateBtn">生成标签</button>
                    <button class="btn btn-secondary" onclick="resetForm()">重置</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面：预览 ===== -->
        <div id="pagePreview" class="page">
            <div class="preview-page">
                <div class="preview-header">
                    <button class="back-btn" onclick="backToCreate()">‹ 返回</button>
                    <span class="info-badge" id="previewInfo">1 张</span>
                </div>
                <div class="preview-list" id="previewList">
                    <!-- 动态生成 -->
                </div>
                <div class="preview-actions">
                    <button class="btn btn-success" onclick="openPrintPage()">🖨️ 打印</button>
                    <button class="btn btn-warning" onclick="sharePreview()">📤 分享</button>
                    <button class="btn btn-secondary" onclick="savePreview()">💾 保存</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面：历史记录 ===== -->
        <div id="pageHistory" class="page">
            <div class="history-section">
                <div class="history-header">
                    <div class="section-title" style="margin-bottom:0;">历史记录</div>
                    <button class="btn btn-secondary" onclick="clearHistory()" style="padding:8px 16px;font-size:13px;border-radius:30px;">清空</button>
                </div>
                <div class="history-grid" id="historyGrid">
                    <div style="text-align:center;padding:30px 0;color:#999;">暂无记录</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== 打印专用页面 ===== -->
    <div class="print-page" id="printPage">
        <div class="print-toolbar">
            <div class="left">
                <span class="title">📄 打印预览</span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn-share-print" onclick="sharePrint()">📤 分享打印</button>
                <button class="btn-print-now" onclick="doPrint()">🖨️ 立即打印</button>
                <button class="btn-close" onclick="closePrintPage()">✕ 关闭</button>
            </div>
        </div>

        <div class="print-tip">
            <span class="icon">📱</span> 
            <strong>手机打印方法：</strong><br>
            ① 点击「立即打印」→ ② 在打印预览中选择「<strong>保存为PDF</strong>」或连接打印机 → ③ 完成打印<br>
            <span style="font-size:13px;color:#999;">💡 若无法打印，可使用「分享打印」发送到电脑或微信</span>
        </div>

        <div class="print-label-wrapper">
            <div class="print-label" id="printLabelContent">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ======================== 数据层 ========================
        const appData = {
            labelHistory: JSON.parse(localStorage.getItem('labelHistory')) || [],
            previewData: {
                orderNo: '',
                amount: '',
                dateStr: ''
            }
        };

        // ======================== DOM 引用 ========================
        const $ = id => document.getElementById(id);
        const orderNo = $('orderNo');
        const amount = $('amount');
        const generateBtn = $('generateBtn');
        const toast = $('toast');
        const printPage = $('printPage');
        const printLabelContent = $('printLabelContent');

        // ======================== 初始化 ========================
        document.addEventListener('DOMContentLoaded', function() {
            bindEvents();
            loadHistory();
            showPage('create');

            // 检测是否在打印页面中
            if (window.location.search.includes('print=1')) {
                // 尝试恢复打印数据
                const saved = sessionStorage.getItem('printData');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        appData.previewData = data;
                        renderPrintLabel();
                        document.querySelector('.app-container').style.display = 'none';
                        printPage.classList.add('show');
                        // 延迟自动打印
                        setTimeout(doPrint, 800);
                    } catch (e) {}
                }
            }
        });

        function bindEvents() {
            orderNo.addEventListener('input', function() {
                if (this.value.trim().length === 0) {
                    this.classList.add('error');
                    $('orderNoError').style.display = 'block';
                } else {
                    this.classList.remove('error');
                    $('orderNoError').style.display = 'none';
                }
                validateForm();
            });

            amount.addEventListener('input', function() {
                validateForm();
            });
        }

        // ======================== 页面切换 ========================
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1));
            if (target) target.classList.add('active');

            const tabMap = { create: 'create', preview: 'create', history: 'history' };
            const tabName = tabMap[page] || 'create';
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.nav-tab[data-tab="${tabName}"]`)?.classList.add('active');
        }

        function switchTab(tab) {
            if (tab === 'create') showPage('create');
            else if (tab === 'history') { showPage('history');
                loadHistory(); }
        }

        function backToCreate() {
            showPage('create');
        }

        // ======================== 表单验证 ========================
        function validateForm() {
            const valid = orderNo.value.trim().length > 0 && amount.value.trim().length > 0 && parseFloat(amount.value) >= 0;
            generateBtn.disabled = !valid;
            return valid;
        }

        // ======================== 获取日期字符串 ========================
        function getDateStr() {
            const now = new Date();
            const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            const day = String(now.getDate()).padStart(2, '0');
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            return `${day} ${month} ${year} ${h}:${m}`;
        }

        // ======================== 生成标签 ========================
        function generateLabel() {
            if (!validateForm()) {
                showToast('请完整填写必填信息');
                return;
            }

            const no = orderNo.value.trim();
            const amt = amount.value.trim();

            appData.previewData = { orderNo: no, amount: amt, dateStr: getDateStr() };
            renderPreview();
            showPage('preview');
            showToast('✅ 标签已生成');
        }

        function renderPreview() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            const container = $('previewList');
            $('previewInfo').textContent = `1 张 · ${no}`;

            container.innerHTML = `
                <div class="label-card">
                    <div>
                        <img src="images/preview-logo1.png" alt="DAFU" class="preview-logo1" onerror="this.style.display='none'">
                    </div>
                    <div class="preview-order">货号: ${no}</div>
                    <div class="preview-divider"></div>
                    <div class="preview-field store-field">金额: ${amt}</div>
                    <div class="preview-field">日期: ${dateStr}</div>
                    <div class="preview-divider"></div>
                    <div class="preview-page-indicator">1/1</div>
                </div>
            `;
        }

        // ======================== 渲染打印标签 ========================
        function renderPrintLabel() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            printLabelContent.innerHTML = `
                <div>
                    <img src="images/preview-logo1.png" alt="DAFU" class="preview-logo1" onerror="this.style.display='none'">
                </div>
                <div class="preview-order">货号: ${no}</div>
                <div class="preview-divider"></div>
                <div class="preview-field store-field">金额: ${amt}</div>
                <div class="preview-field">日期: ${dateStr}</div>
                <div class="preview-divider"></div>
                <div class="preview-page-indicator">1/1</div>
            `;
        }

        // ======================== 打开打印页面 ========================
        function openPrintPage() {
            const { orderNo: no, amount: amt } = appData.previewData;
            if (!no) {
                showToast('请先生成标签');
                return;
            }

            // 保存打印数据到 sessionStorage
            sessionStorage.setItem('printData', JSON.stringify(appData.previewData));

            renderPrintLabel();
            printPage.classList.add('show');
            document.body.style.overflow = 'hidden';

            showToast('📄 已打开打印预览');

            // 延迟自动弹出打印对话框（部分浏览器支持）
            setTimeout(function() {
                // 不自动弹出，让用户手动点击
            }, 500);
        }

        // ======================== 关闭打印页面 ========================
        function closePrintPage() {
            printPage.classList.remove('show');
            document.body.style.overflow = '';
            sessionStorage.removeItem('printData');
        }

        // ======================== 执行打印 ========================
        function doPrint() {
            showToast('🖨️ 正在打开打印...');
            // 直接调用 window.print()，此时打印页面可见
            window.print();
            // 部分浏览器需要延迟
            setTimeout(function() {
                showToast('🖨️ 打印对话框已打开');
            }, 500);
        }

        // ======================== 分享打印（通过系统分享） ========================
        function sharePrint() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            if (!no) { showToast('请先生成标签'); return; }

            const shareText = `📦 大福面单\n货号: ${no}\n金额: ${amt}\n日期: ${dateStr}\n\n请使用打印机打印此标签`;

            if (navigator.share) {
                navigator.share({
                    title: '大福面单',
                    text: shareText,
                }).then(() => {
                    showToast('📤 已分享');
                }).catch(() => {});
            } else {
                // 复制到剪贴板
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('📋 已复制，可粘贴到微信或邮件');
                }).catch(() => {
                    // 降级：弹出复制框
                    const textarea = document.createElement('textarea');
                    textarea.value = shareText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        showToast('📋 已复制到剪贴板');
                    } catch (e) {
                        prompt('复制以下内容：', shareText);
                    }
                    document.body.removeChild(textarea);
                });
            }
        }

        // ======================== 分享 ========================
        function sharePreview() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            if (!no) { showToast('请先生成标签'); return; }

            const shareText = `📦 大福面单\n货号: ${no}\n金额: ${amt}\n日期: ${dateStr}`;

            if (navigator.share) {
                navigator.share({
                    title: '大福面单',
                    text: shareText,
                }).then(() => {
                    showToast('📤 分享成功');
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('📋 已复制到剪贴板');
                }).catch(() => {
                    prompt('复制以下内容分享：', shareText);
                });
            }
        }

        // ======================== 保存 ========================
        function savePreview() {
            const { orderNo: no, amount: amt } = appData.previewData;
            if (!no) { showToast('请先生成标签'); return; }
            saveToHistory(no, amt);
            showToast('💾 已保存到历史');
        }

        function saveToHistory(no, amt) {
            const data = {
                id: Date.now(),
                orderNo: no,
                amount: amt,
                createTime: new Date().toLocaleString('zh-CN')
            };
            appData.labelHistory.unshift(data);
            localStorage.setItem('labelHistory', JSON.stringify(appData.labelHistory));
        }

        function resetForm() {
            orderNo.value = '';
            amount.value = '';
            validateForm();
            showToast('🔄 已重置');
        }

        // ======================== 历史记录 ========================
        function loadHistory() {
            const grid = $('historyGrid');
            const history = appData.labelHistory;
            if (history.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:30px 0;color:#999;">暂无记录</div>';
                return;
            }
            grid.innerHTML = history.map(item => `
                <div class="history-card">
                    <div class="history-order">📦 货号: ${item.orderNo}</div>
                    <div class="history-customer">💰 金额: ${item.amount}</div>
                    <div class="history-meta"><span>${item.createTime}</span></div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('确定清空所有历史记录？')) {
                appData.labelHistory = [];
                localStorage.setItem('labelHistory', JSON.stringify([]));
                loadHistory();
                showToast('已清空');
            }
        }

        // ======================== Toast ========================
        let toastTimer = null;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ======================== 对外暴露 ========================
        window.switchTab = switchTab;
        window.generateLabel = generateLabel;
        window.openPrintPage = openPrintPage;
        window.closePrintPage = closePrintPage;
        window.doPrint = doPrint;
        window.sharePrint = sharePrint;
        window.sharePreview = sharePreview;
        window.savePreview = savePreview;
        window.backToCreate = backToCreate;
        window.resetForm = resetForm;
        window.clearHistory = clearHistory;
        window.showToast = showToast;
    </script>

</body>
</html>
