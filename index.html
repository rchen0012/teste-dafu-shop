<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>大福面单 · 手机版</title>
    <style>
        /* ===== 全局重置 & 移动优先 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0ABAB5 0%, #008E9B 100%);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            padding: 18px 16px 28px;
            margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8f0f0;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-image {
            height: 32px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
        }

        .logo-text h1 {
            font-size: 17px;
            font-weight: 700;
            color: #1e1e2a;
            line-height: 1.2;
        }

        .logo-text .subtitle {
            font-size: 10px;
            color: #888;
            font-weight: 400;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .nav-tab {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            background: #f0f6f6;
            color: #666;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            border: none;
        }

        .nav-tab.active {
            background: #0ABAB5;
            color: white;
            box-shadow: 0 4px 10px rgba(10, 186, 181, 0.25);
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ===== 表单区域 ===== */
        .form-section {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e1e2a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #0ABAB5;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        label .required {
            color: #ff4757;
            margin-left: 2px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0ecec;
            border-radius: 14px;
            font-size: 16px;
            background: white;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
            color: #1e1e2a;
        }

        input:focus {
            outline: none;
            border-color: #0ABAB5;
            box-shadow: 0 0 0 4px rgba(10, 186, 181, 0.12);
        }

        input.error {
            border-color: #ff4757;
        }

        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* ===== 按钮 ===== */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .btn {
            flex: 1;
            padding: 16px 10px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            touch-action: manipulation;
        }

        .btn-primary {
            background: #0ABAB5;
            color: white;
            box-shadow: 0 6px 16px rgba(10, 186, 181, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.96);
            background: #008E9B;
        }

        .btn-primary:disabled {
            background: #ccc;
            box-shadow: none;
            transform: none;
            opacity: 0.6;
        }

        .btn-secondary {
            background: #e8f0f0;
            color: #0ABAB5;
        }

        .btn-secondary:active {
            background: #d0e6e6;
            transform: scale(0.96);
        }

        .btn-success {
            background: #28a745;
            color: white;
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.25);
        }
        .btn-success:active {
            transform: scale(0.96);
            background: #1e7e34;
        }

        .btn-warning {
            background: #ffc107;
            color: #1e1e2a;
            box-shadow: 0 6px 16px rgba(255, 193, 7, 0.25);
        }
        .btn-warning:active {
            transform: scale(0.96);
            background: #e0a800;
        }

        /* ===== 预览页面 ===== */
        .preview-page {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .preview-header .back-btn {
            background: none;
            border: none;
            color: #0ABAB5;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .preview-header .back-btn:active {
            opacity: 0.6;
        }

        .preview-header .info-badge {
            font-size: 13px;
            color: #666;
            background: white;
            padding: 4px 14px;
            border-radius: 30px;
        }

        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-bottom: 8px;
        }

        /* ===== 标签预览卡片 ===== */
        .label-card {
            background: white;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 16px 18px;
            position: relative;
            font-family: Arial, sans-serif;
            min-height: 150px;
            flex-shrink: 0;
        }

        .label-card .preview-logo1 {
            height: 28px;
            width: auto;
            object-fit: contain;
            display: inline-block;
        }

        .label-card .preview-order {
            font-size: 22px;
            font-weight: bold;
            margin: 6px 0 4px;
            color: #1e1e2a;
        }

        .label-card .preview-divider {
            border-top: 2px dashed #ccc;
            margin: 8px 0;
        }

        .label-card .preview-field {
            font-size: 14px;
            margin: 4px 0;
            color: #1e1e2a;
        }

        .label-card .preview-field.store-field {
            font-size: 20px;
            font-weight: bold;
            color: #0a2a3a;
        }

        .label-card .preview-page-indicator {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            opacity: 0.7;
            text-align: center;
            margin-top: 6px;
        }

        .preview-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .preview-actions .btn {
            flex: 1;
            min-width: 80px;
        }

        /* ===== 历史记录 ===== */
        .history-section {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .history-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            border-left: 4px solid #0ABAB5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .history-order {
            font-weight: 600;
            color: #1e1e2a;
            font-size: 15px;
        }

        .history-customer {
            color: #666;
            font-size: 14px;
            margin-top: 2px;
        }

        .history-meta {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e2a;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
            z-index: 999;
            animation: slideDown 0.35s ease;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ===== 打印专用隐藏 iframe ===== */
        .print-iframe {
            position: fixed;
            left: -9999px;
            top: -9999px;
            width: 0;
            height: 0;
            border: none;
            visibility: hidden;
        }

        /* ===== 打印样式 ===== */
        @media print {
            body * {
                visibility: hidden;
            }
            .label-card,
            .label-card * {
                visibility: visible;
            }
            .label-card {
                position: absolute;
                left: 0;
                top: 0;
                width: 100mm;
                height: 150mm;
                border: 2px solid #000;
                padding: 7mm;
                font-family: Arial, sans-serif;
                background: white;
                page-break-after: always;
                border-radius: 0;
            }
            .label-card .preview-logo1 {
                height: 12mm;
            }
            .label-card .preview-order {
                font-size: 11mm;
            }
            .label-card .preview-field.store-field {
                font-size: 9mm;
            }
            .label-card .preview-page-indicator {
                font-size: 16mm;
            }
            .preview-page .preview-header,
            .preview-page .preview-actions {
                display: none !important;
            }
            .print-iframe {
                display: none !important;
            }
        }

        /* ===== 工具 ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="logo">
                <img src="images/form-logonova.png" alt="dafu pano Logo" class="logo-image">
                <div class="logo-text">
                    <h1>面单打印小程序</h1>
                    <div class="subtitle">DAFU Label Printing System</div>
                </div>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="create" onclick="switchTab('create')">标签</button>
                <button class="nav-tab" data-tab="history" onclick="switchTab('history')">记录</button>
            </div>
        </header>

        <!-- ===== 页面：创建标签 ===== -->
        <div id="pageCreate" class="page active">
            <div class="form-section">
                <div class="section-title">订单信息</div>

                <div class="form-group">
                    <label>货号 <span class="required">*</span></label>
                    <input type="text" id="orderNo" placeholder="输入货号" maxlength="20">
                    <div class="error-message" id="orderNoError">请输入货号</div>
                </div>

                <div class="form-group">
                    <label>金额 <span class="required">*</span></label>
                    <input type="number" id="amount" placeholder="输入金额" step="0.01" min="0">
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="generateLabel()" id="generateBtn">生成标签</button>
                    <button class="btn btn-secondary" onclick="resetForm()">重置</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面：预览 ===== -->
        <div id="pagePreview" class="page">
            <div class="preview-page">
                <div class="preview-header">
                    <button class="back-btn" onclick="backToCreate()">‹ 返回</button>
                    <span class="info-badge" id="previewInfo">1 张</span>
                </div>
                <div class="preview-list" id="previewList">
                    <!-- 动态生成 -->
                </div>
                <div class="preview-actions">
                    <button class="btn btn-success" onclick="printPreview()">🖨️ 打印</button>
                    <button class="btn btn-warning" onclick="sharePreview()">📤 分享</button>
                    <button class="btn btn-secondary" onclick="savePreview()">💾 保存</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面：历史记录 ===== -->
        <div id="pageHistory" class="page">
            <div class="history-section">
                <div class="history-header">
                    <div class="section-title" style="margin-bottom:0;">历史记录</div>
                    <button class="btn btn-secondary" onclick="clearHistory()" style="padding:8px 16px;font-size:13px;border-radius:30px;">清空</button>
                </div>
                <div class="history-grid" id="historyGrid">
                    <div style="text-align:center;padding:30px 0;color:#999;">暂无记录</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== 隐藏的 iframe 用于打印 ===== -->
    <iframe id="printIframe" class="print-iframe"></iframe>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ======================== 数据层 ========================
        const appData = {
            labelHistory: JSON.parse(localStorage.getItem('labelHistory')) || [],
            previewData: {
                orderNo: '',
                amount: '',
                dateStr: ''
            }
        };

        // ======================== DOM 引用 ========================
        const $ = id => document.getElementById(id);
        const orderNo = $('orderNo');
        const amount = $('amount');
        const generateBtn = $('generateBtn');
        const toast = $('toast');
        const printIframe = $('printIframe');

        // ======================== 初始化 ========================
        document.addEventListener('DOMContentLoaded', function() {
            bindEvents();
            loadHistory();
            showPage('create');
        });

        function bindEvents() {
            orderNo.addEventListener('input', function() {
                if (this.value.trim().length === 0) {
                    this.classList.add('error');
                    $('orderNoError').style.display = 'block';
                } else {
                    this.classList.remove('error');
                    $('orderNoError').style.display = 'none';
                }
                validateForm();
            });

            amount.addEventListener('input', function() {
                validateForm();
            });
        }

        // ======================== 页面切换 ========================
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1));
            if (target) target.classList.add('active');

            const tabMap = { create: 'create', preview: 'create', history: 'history' };
            const tabName = tabMap[page] || 'create';
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.nav-tab[data-tab="${tabName}"]`)?.classList.add('active');
        }

        function switchTab(tab) {
            if (tab === 'create') showPage('create');
            else if (tab === 'history') { showPage('history');
                loadHistory(); }
        }

        function backToCreate() {
            showPage('create');
        }

        // ======================== 表单验证 ========================
        function validateForm() {
            const valid = orderNo.value.trim().length > 0 && amount.value.trim().length > 0 && parseFloat(amount.value) >= 0;
            generateBtn.disabled = !valid;
            return valid;
        }

        // ======================== 获取日期字符串 ========================
        function getDateStr() {
            const now = new Date();
            const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            const day = String(now.getDate()).padStart(2, '0');
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            return `${day} ${month} ${year} ${h}:${m}`;
        }

        // ======================== 生成标签 ========================
        function generateLabel() {
            if (!validateForm()) {
                showToast('请完整填写必填信息');
                return;
            }

            const no = orderNo.value.trim();
            const amt = amount.value.trim();

            appData.previewData = { orderNo: no, amount: amt, dateStr: getDateStr() };
            renderPreview();
            showPage('preview');
            showToast('✅ 标签已生成');
        }

        function renderPreview() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            const container = $('previewList');
            $('previewInfo').textContent = `1 张 · ${no}`;

            container.innerHTML = `
                <div class="label-card">
                    <div>
                        <img src="images/preview-logo1.png" alt="DAFU" class="preview-logo1" onerror="this.style.display='none'">
                    </div>
                    <div class="preview-order">货号: ${no}</div>
                    <div class="preview-divider"></div>
                    <div class="preview-field store-field">金额: ${amt}</div>
                    <div class="preview-field">日期: ${dateStr}</div>
                    <div class="preview-divider"></div>
                    <div class="preview-page-indicator">1/1</div>
                </div>
            `;
        }

        // ======================== 打印（通过 iframe 方式，兼容手机） ========================
        function printPreview() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            if (!no) {
                showToast('请先生成标签');
                return;
            }

            showToast('🖨️ 正在准备打印...');

            // 构建打印内容
            const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>大福面单 - ${no}</title>
                    <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body {
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            min-height: 100vh;
                            background: #f5f5f5;
                            font-family: Arial, sans-serif;
                            padding: 20px;
                        }
                        .label-card {
                            width: 100mm;
                            height: 150mm;
                            border: 2px solid #000;
                            padding: 7mm;
                            background: white;
                            font-family: Arial, sans-serif;
                            box-sizing: border-box;
                            position: relative;
                        }
                        .preview-logo1 {
                            height: 12mm;
                            width: auto;
                            object-fit: contain;
                            display: inline-block;
                        }
                        .preview-order {
                            font-size: 11mm;
                            font-weight: bold;
                            margin: 4mm 0 3mm 0;
                            color: #1e1e2a;
                        }
                        .preview-divider {
                            border-top: 1mm dashed #ccc;
                            margin: 3mm 0;
                        }
                        .preview-field {
                            font-size: 5.5mm;
                            margin: 2mm 0;
                            color: #1e1e2a;
                        }
                        .preview-field.store-field {
                            font-size: 9mm;
                            font-weight: bold;
                            color: #0a2a3a;
                            margin: 3mm 0;
                        }
                        .preview-page-indicator {
                            position: absolute;
                            bottom: 6mm;
                            left: 50%;
                            transform: translateX(-50%);
                            font-size: 16mm;
                            font-weight: bold;
                            color: #1a1a1a;
                            opacity: 0.7;
                        }
                        @page {
                            margin: 0;
                            size: 100mm 150mm;
                        }
                        @media print {
                            body { background: white; padding: 0; }
                        }
                    </style>
                </head>
                <body>
                    <div class="label-card">
                        <div>
                            <img src="images/preview-logo1.png" alt="DAFU" class="preview-logo1" onerror="this.style.display='none'">
                        </div>
                        <div class="preview-order">货号: ${no}</div>
                        <div class="preview-divider"></div>
                        <div class="preview-field store-field">金额: ${amt}</div>
                        <div class="preview-field">日期: ${dateStr}</div>
                        <div class="preview-divider"></div>
                        <div class="preview-page-indicator">1/1</div>
                    </div>
                    <script>
                        // 页面加载后自动打印
                        window.onload = function() {
                            setTimeout(function() {
                                window.print();
                            }, 500);
                        };
                    <\/script>
                </body>
                </html>
            `;

            // 方法1: 使用 iframe 打印（兼容性最好）
            try {
                const iframe = printIframe;
                const doc = iframe.contentWindow.document;
                doc.open();
                doc.write(printContent);
                doc.close();

                // 监听 iframe 加载完成
                iframe.onload = function() {
                    setTimeout(function() {
                        iframe.contentWindow.print();
                        showToast('🖨️ 打印对话框已打开');
                    }, 600);
                };

                // 如果 iframe 已经加载完成，直接打印
                setTimeout(function() {
                    if (iframe.contentWindow && iframe.contentWindow.document && iframe.contentWindow.document.body) {
                        iframe.contentWindow.print();
                        showToast('🖨️ 打印对话框已打开');
                    }
                }, 800);

            } catch (e) {
                // 方法2: 降级方案 - 使用新窗口
                try {
                    const win = window.open('', '_blank', 'width=400,height=600');
                    if (win) {
                        win.document.write(printContent);
                        win.document.close();
                        setTimeout(function() {
                            win.print();
                            showToast('🖨️ 打印对话框已打开');
                        }, 500);
                    } else {
                        showToast('⚠️ 请允许弹出窗口');
                    }
                } catch (e2) {
                    showToast('⚠️ 打印失败，请使用"分享"功能');
                }
            }
        }

        // ======================== 分享 ========================
        function sharePreview() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            if (!no) { showToast('请先生成标签'); return; }

            const shareText = `📦 大福面单\n货号: ${no}\n金额: ${amt}\n日期: ${dateStr}`;

            if (navigator.share) {
                navigator.share({
                    title: '大福面单',
                    text: shareText,
                }).then(() => {
                    showToast('📤 分享成功');
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('📋 已复制到剪贴板');
                }).catch(() => {
                    prompt('复制以下内容分享：', shareText);
                });
            }
        }

        // ======================== 保存 ========================
        function savePreview() {
            const { orderNo: no, amount: amt } = appData.previewData;
            if (!no) { showToast('请先生成标签'); return; }
            saveToHistory(no, amt);
            showToast('💾 已保存到历史');
        }

        function saveToHistory(no, amt) {
            const data = {
                id: Date.now(),
                orderNo: no,
                amount: amt,
                createTime: new Date().toLocaleString('zh-CN')
            };
            appData.labelHistory.unshift(data);
            localStorage.setItem('labelHistory', JSON.stringify(appData.labelHistory));
        }

        function resetForm() {
            orderNo.value = '';
            amount.value = '';
            validateForm();
            showToast('🔄 已重置');
        }

        // ======================== 历史记录 ========================
        function loadHistory() {
            const grid = $('historyGrid');
            const history = appData.labelHistory;
            if (history.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:30px 0;color:#999;">暂无记录</div>';
                return;
            }
            grid.innerHTML = history.map(item => `
                <div class="history-card">
                    <div class="history-order">📦 货号: ${item.orderNo}</div>
                    <div class="history-customer">💰 金额: ${item.amount}</div>
                    <div class="history-meta"><span>${item.createTime}</span></div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('确定清空所有历史记录？')) {
                appData.labelHistory = [];
                localStorage.setItem('labelHistory', JSON.stringify([]));
                loadHistory();
                showToast('已清空');
            }
        }

        // ======================== Toast ========================
        let toastTimer = null;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ======================== 对外暴露 ========================
        window.switchTab = switchTab;
        window.generateLabel = generateLabel;
        window.printPreview = printPreview;
        window.sharePreview = sharePreview;
        window.savePreview = savePreview;
        window.backToCreate = backToCreate;
        window.resetForm = resetForm;
        window.clearHistory = clearHistory;
        window.showToast = showToast;
    </script>

</body>
</html>
