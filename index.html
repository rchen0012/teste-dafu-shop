<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>大福面单 · 蓝牙打印</title>
    <style>
        /* ============================================================
           完整样式定义
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0ABAB5 0%, #008E9B 100%);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            padding: 18px 16px 28px;
            margin: 0 auto;
        }

        /* ----- 头部 ----- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8f0f0;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-image {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .logo-text h1 {
            font-size: 17px;
            font-weight: 700;
            color: #1e1e2a;
            line-height: 1.2;
        }

        .logo-text .subtitle {
            font-size: 10px;
            color: #888;
            font-weight: 400;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .nav-tab {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            background: #f0f6f6;
            color: #666;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-tab:active {
            transform: scale(0.96);
        }

        .nav-tab.active {
            background: #0ABAB5;
            color: #fff;
            box-shadow: 0 4px 10px rgba(10, 186, 181, 0.25);
        }

        /* ----- 页面 ----- */
        .page {
            display: none;
        }
        .page.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ----- 表单 ----- */
        .form-section {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e1e2a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #0ABAB5;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        label .required {
            color: #ff4757;
            margin-left: 2px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0ecec;
            border-radius: 14px;
            font-size: 16px;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
            color: #1e1e2a;
            min-height: 52px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #0ABAB5;
            box-shadow: 0 0 0 4px rgba(10, 186, 181, 0.12);
        }

        input.error {
            border-color: #ff4757;
        }

        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* ----- 按钮 ----- */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .btn {
            flex: 1;
            padding: 16px 10px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            min-height: 54px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #0ABAB5;
            color: #fff;
            box-shadow: 0 6px 16px rgba(10, 186, 181, 0.25);
        }
        .btn-primary:disabled {
            background: #ccc;
            box-shadow: none;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e8f0f0;
            color: #0ABAB5;
        }
        .btn-secondary:active {
            background: #d0e6e6;
        }

        .btn-pdf {
            background: #dc3545;
            color: #fff;
            box-shadow: 0 6px 16px rgba(220, 53, 69, 0.25);
        }
        .btn-pdf:active {
            background: #c82333;
        }
        .btn-pdf:disabled {
            background: #ccc;
            box-shadow: none;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-bluetooth {
            background: #007AFF;
            color: #fff;
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.25);
        }
        .btn-bluetooth:active {
            background: #0055CC;
        }
        .btn-bluetooth:disabled {
            background: #ccc;
            box-shadow: none;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-success {
            background: #28a745;
            color: #fff;
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.25);
        }
        .btn-success:active {
            background: #1e7e34;
        }

        /* ----- 蓝牙状态 ----- */
        .bluetooth-status {
            background: #f5fafa;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #e8f0f0;
        }

        .bluetooth-status .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .bluetooth-status .dot.disconnected {
            background: #ff4757;
        }

        .bluetooth-status .dot.connecting {
            background: #ffc107;
            animation: pulse 0.8s infinite;
        }

        .bluetooth-status .dot.connected {
            background: #28a745;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .bluetooth-status .info {
            flex: 1;
            font-size: 14px;
            color: #444;
        }

        .bluetooth-status .info .device-name {
            font-weight: 600;
            color: #1e1e2a;
        }

        /* ----- 设备列表 ----- */
        .device-list {
            background: #f5fafa;
            border-radius: 16px;
            padding: 12px 0;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .device-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #e8f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .device-item:active {
            background: #e8f0f0;
        }

        .device-item:last-child {
            border-bottom: none;
        }

        .device-item .name {
            font-size: 14px;
            color: #1e1e2a;
        }

        .device-item .rssi {
            font-size: 12px;
            color: #999;
        }

        .device-item .connect-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: #0ABAB5;
            color: #fff;
        }
        .device-item .connect-btn:active {
            transform: scale(0.95);
        }

        /* ----- 预览卡片 ----- */
        .preview-page {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preview-header .back-btn {
            background: none;
            border: none;
            color: #0ABAB5;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 44px;
        }
        .preview-header .back-btn:active {
            opacity: 0.6;
        }

        .preview-header .info-badge {
            font-size: 13px;
            color: #666;
            background: #fff;
            padding: 6px 14px;
            border-radius: 30px;
        }

        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 65vh;
            overflow-y: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .label-card {
            background: #fff;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 16px 18px;
            font-family: Arial, sans-serif;
            min-height: 150px;
            flex-shrink: 0;
        }

        .label-card .preview-logo1 {
            height: 28px;
            width: auto;
            object-fit: contain;
            display: inline-block;
        }

        .label-card .preview-order {
            font-size: 22px;
            font-weight: bold;
            margin: 6px 0 4px;
            color: #1e1e2a;
        }

        .label-card .preview-divider {
            border-top: 2px dashed #ccc;
            margin: 8px 0;
        }

        .label-card .preview-field {
            font-size: 14px;
            margin: 4px 0;
            color: #1e1e2a;
        }

        .label-card .preview-field.store-field {
            font-size: 20px;
            font-weight: bold;
            color: #0a2a3a;
        }

        .label-card .preview-page-indicator {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            opacity: 0.7;
            text-align: center;
            margin-top: 6px;
        }

        .preview-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .preview-actions .btn {
            flex: 1;
            min-width: 80px;
        }

        /* ----- 历史记录 ----- */
        .history-section {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            border-left: 4px solid #0ABAB5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .history-order {
            font-weight: 600;
            color: #1e1e2a;
            font-size: 15px;
        }
        .history-customer {
            color: #666;
            font-size: 14px;
            margin-top: 2px;
        }
        .history-meta {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* ----- Toast ----- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e2a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
            z-index: 99999;
            animation: slideDown 0.35s ease;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ----- 进度 ----- */
        .progress-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99998;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .progress-overlay.show {
            display: flex;
        }
        .progress-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #fff;
            border-top: 4px solid #0ABAB5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .progress-overlay .label {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 16px;
        }
        .progress-overlay .sub-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-top: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="logo">
                <img src="images/form-logonova.png" alt="Logo" class="logo-image" onerror="this.style.display='none'">
                <div class="logo-text">
                    <h1>面单打印</h1>
                    <div class="subtitle">蓝牙 · DAFU</div>
                </div>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="create">标签</button>
                <button class="nav-tab" data-tab="bluetooth">蓝牙</button>
                <button class="nav-tab" data-tab="history">记录</button>
            </div>
        </header>

        <!-- ===== 页面：创建标签 ===== -->
        <div id="pageCreate" class="page active">
            <div class="form-section">
                <div class="section-title">订单信息</div>

                <!-- 蓝牙状态 -->
                <div class="bluetooth-status" id="btStatus">
                    <div class="dot disconnected" id="btDot"></div>
                    <div class="info">
                        <span id="btStatusText">未连接</span>
                        <span class="device-name" id="btDeviceName"></span>
                    </div>
                    <button class="btn btn-bluetooth" id="btQuickConnect" style="flex:0 0 auto;padding:8px 16px;font-size:13px;min-height:36px;border-radius:30px;">
                        📶 连接
                    </button>
                </div>

                <div class="form-group">
                    <label>货号 <span class="required">*</span></label>
                    <input type="text" id="orderNo" placeholder="输入货号" maxlength="20">
                    <div class="error-message" id="orderNoError">请输入货号</div>
                </div>

                <div class="form-group">
                    <label>金额 <span class="required">*</span></label>
                    <input type="number" id="amount" placeholder="输入金额" step="0.01" min="0">
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="generateBtn">生成标签</button>
                    <button class="btn btn-secondary" id="resetBtn">重置</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面：蓝牙 ===== -->
        <div id="pageBluetooth" class="page">
            <div class="form-section">
                <div class="section-title">蓝牙打印机</div>

                <div class="bluetooth-status" style="margin-bottom:16px;">
                    <div class="dot disconnected" id="btDot2"></div>
                    <div class="info">
                        <span id="btStatusText2">未连接</span>
                        <span class="device-name" id="btDeviceName2"></span>
                    </div>
                </div>

                <div style="display:flex;gap:12px;margin-bottom:16px;">
                    <button class="btn btn-bluetooth" id="scanBtn" style="flex:1;">🔍 扫描设备</button>
                    <button class="btn btn-secondary" id="disconnectBtn" style="flex:1;">断开连接</button>
                </div>

                <div class="device-list" id="deviceList">
                    <div style="text-align:center;padding:20px;color:#999;font-size:14px;">
                        点击「扫描设备」搜索附近的蓝牙打印机
                    </div>
                </div>

                <div style="font-size:13px;color:#999;padding:8px 4px;line-height:1.6;">
                    💡 <strong>提示：</strong><br>
                    • 确保打印机已开启并处于可发现模式<br>
                    • 部分打印机需要配对后才能连接<br>
                    • 支持 BLE (低功耗蓝牙) 打印机
                </div>
            </div>
        </div>

        <!-- ===== 页面：预览 ===== -->
        <div id="pagePreview" class="page">
            <div class="preview-page">
                <div class="preview-header">
                    <button class="back-btn" id="backBtn">‹ 返回</button>
                    <span class="info-badge" id="previewInfo">1 张</span>
                </div>
                <div class="preview-list" id="previewList"></div>
                <div class="preview-actions">
                    <button class="btn btn-pdf" id="downloadPdfBtn">📄 下载PDF</button>
                    <button class="btn btn-success" id="btPrintBtn" disabled>🖨️ 蓝牙打印</button>
                    <button class="btn btn-secondary" id="saveBtn">💾 保存</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面：历史记录 ===== -->
        <div id="pageHistory" class="page">
            <div class="history-section">
                <div class="history-header">
                    <div class="section-title" style="margin-bottom:0;">历史记录</div>
                    <button class="btn btn-secondary" id="clearHistoryBtn" style="padding:8px 16px;font-size:13px;border-radius:30px;">清空</button>
                </div>
                <div class="history-grid" id="historyGrid">
                    <div style="text-align:center;padding:30px 0;color:#999;">暂无记录</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== 进度 ===== -->
    <div class="progress-overlay" id="progressOverlay">
        <div class="spinner"></div>
        <div class="label" id="progressLabel">⏳ 正在处理...</div>
        <div class="sub-label" id="progressSubLabel">请稍候</div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // 蓝牙打印管理器
        // ============================================================
        var BluetoothManager = (function() {
            var _device = null;
            var _server = null;
            var _service = null;
            var _characteristic = null;
            var _isConnected = false;
            var _callbacks = {};

            // 常见蓝牙打印机服务UUID
            var PRINTER_SERVICE_UUID = '000018f0-0000-1000-8000-00805f9b34fb';
            var PRINTER_CHARACTERISTIC_UUID = '00002af1-0000-1000-8000-00805f9b34fb';

            // 其他常见服务
            var COMMON_SERVICES = [
                '000018f0-0000-1000-8000-00805f9b34fb',
                '0000fee7-0000-1000-8000-00805f9b34fb',
                '0000fff0-0000-1000-8000-00805f9b34fb',
                '0000ff00-0000-1000-8000-00805f9b34fb'
            ];

            function _log(msg) {
                console.log('[Bluetooth]', msg);
                if (_callbacks.onLog) _callbacks.onLog(msg);
            }

            function _updateStatus(status, deviceName) {
                if (_callbacks.onStatusChange) {
                    _callbacks.onStatusChange(status, deviceName);
                }
                _isConnected = (status === 'connected');
            }

            // ----- 检查浏览器支持 -----
            function isSupported() {
                return !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
            }

            // ----- 扫描设备 -----
            function scanDevices(callback) {
                if (!isSupported()) {
                    _log('浏览器不支持 Web Bluetooth API');
                    callback([]);
                    return;
                }

                _log('开始扫描蓝牙设备...');

                // 尝试使用特定的服务UUID过滤
                var options = {
                    filters: [
                        { services: [PRINTER_SERVICE_UUID] },
                        { namePrefix: 'PRINTER' },
                        { namePrefix: 'BT' },
                        { namePrefix: 'BLE' }
                    ],
                    optionalServices: COMMON_SERVICES,
                    acceptAllDevices: false
                };

                // 如果过滤条件太严格，回退到扫描所有设备
                navigator.bluetooth.requestDevice(options)
                    .then(function(device) {
                        _log('找到设备: ' + (device.name || '未知设备'));
                        callback([device]);
                    })
                    .catch(function(error) {
                        _log('扫描失败: ' + error.message);
                        // 尝试扫描所有设备
                        navigator.bluetooth.requestDevice({
                            acceptAllDevices: true,
                            optionalServices: COMMON_SERVICES
                        }).then(function(device) {
                            _log('找到设备(全扫描): ' + (device.name || '未知设备'));
                            callback([device]);
                        }).catch(function(err) {
                            _log('全扫描失败: ' + err.message);
                            callback([]);
                        });
                    });
            }

            // ----- 连接设备 -----
            function connect(device, callback) {
                if (!device) {
                    _log('设备无效');
                    if (callback) callback(false);
                    return;
                }

                _log('正在连接: ' + (device.name || '未知设备'));
                _updateStatus('connecting', device.name || '未知设备');

                device.gatt.connect()
                    .then(function(server) {
                        _server = server;
                        _device = device;
                        _log('连接成功，获取服务...');

                        return server.getPrimaryServices();
                    })
                    .then(function(services) {
                        _log('找到 ' + services.length + ' 个服务');
                        // 查找打印服务
                        var found = false;
                        for (var i = 0; i < services.length; i++) {
                            var svc = services[i];
                            _log('服务: ' + svc.uuid);
                            // 检查是否匹配打印服务
                            if (COMMON_SERVICES.indexOf(svc.uuid) !== -1 ||
                                svc.uuid.toLowerCase().indexOf('f0') !== -1 ||
                                svc.uuid.toLowerCase().indexOf('ff') !== -1) {
                                _service = svc;
                                found = true;
                                break;
                            }
                        }

                        if (!found && services.length > 0) {
                            _service = services[0];
                        }

                        if (!_service) {
                            throw new Error('未找到打印服务');
                        }

                        _log('使用服务: ' + _service.uuid);
                        return _service.getCharacteristics();
                    })
                    .then(function(characteristics) {
                        _log('找到 ' + characteristics.length + ' 个特征');
                        // 查找可写特征
                        for (var i = 0; i < characteristics.length; i++) {
                            var char = characteristics[i];
                            _log('特征: ' + char.uuid + ' properties: ' + char.properties);
                            if (char.properties.write || char.properties.writeWithoutResponse) {
                                _characteristic = char;
                                break;
                            }
                        }

                        if (!_characteristic) {
                            throw new Error('未找到可写特征');
                        }

                        _isConnected = true;
                        _updateStatus('connected', _device.name || '未知设备');
                        _log('✅ 蓝牙打印机连接成功');
                        if (callback) callback(true);
                    })
                    .catch(function(error) {
                        _log('❌ 连接失败: ' + error.message);
                        _updateStatus('disconnected', '');
                        if (callback) callback(false);
                    });
            }

            // ----- 断开连接 -----
            function disconnect() {
                if (_server && _server.connected) {
                    try {
                        _server.disconnect();
                        _log('已断开连接');
                    } catch (e) {
                        _log('断开连接失败: ' + e.message);
                    }
                }
                _device = null;
                _server = null;
                _service = null;
                _characteristic = null;
                _isConnected = false;
                _updateStatus('disconnected', '');
            }

            // ----- 打印数据 -----
            function printData(data) {
                return new Promise(function(resolve, reject) {
                    if (!_isConnected || !_characteristic) {
                        reject(new Error('未连接蓝牙打印机'));
                        return;
                    }

                    // 确保数据是 Uint8Array
                    var byteData;
                    if (typeof data === 'string') {
                        // 文本转字节 (使用 GBK/UTF-8 编码)
                        var encoder = new TextEncoder();
                        byteData = encoder.encode(data);
                    } else if (data instanceof Uint8Array) {
                        byteData = data;
                    } else if (Array.isArray(data)) {
                        byteData = new Uint8Array(data);
                    } else {
                        reject(new Error('不支持的数据格式'));
                        return;
                    }

                    _log('发送数据: ' + byteData.length + ' 字节');

                    _characteristic.writeValue(byteData)
                        .then(function() {
                            _log('✅ 数据发送成功');
                            resolve(true);
                        })
                        .catch(function(error) {
                            _log('❌ 数据发送失败: ' + error.message);
                            reject(error);
                        });
                });
            }

            // ----- 打印文本 (ESC/POS 格式) -----
            function printText(text) {
                var encoder = new TextEncoder();
                // 添加 ESC/POS 命令: 初始化打印机
                var init = new Uint8Array([0x1B, 0x40]);
                // 换行
                var newline = new Uint8Array([0x0A]);
                // 打印并走纸
                var printAndFeed = new Uint8Array([0x1B, 0x64, 0x05]);

                var textData = encoder.encode(text);

                // 合并所有数据
                var totalLength = init.length + textData.length + newline.length + printAndFeed.length;
                var combined = new Uint8Array(totalLength);
                var offset = 0;

                combined.set(init, offset);
                offset += init.length;

                combined.set(textData, offset);
                offset += textData.length;

                combined.set(newline, offset);
                offset += newline.length;

                combined.set(printAndFeed, offset);

                return printData(combined);
            }

            // ============================================================

            // ============================================================
            function downloadPdf() {
                var data = appData.previewData;
                if (!data.orderNo) {
                    showToast('请先生成标签');
                    return;
                }

                showProgress('📄 正在生成PDF...', '请稍候');

                // 使用 Canvas 生成 PDF
                var canvas = document.createElement('canvas');
                var mmToPx = 3.78;
                var w = 100 * mmToPx;
                var h = 150 * mmToPx;
                canvas.width = w;
                canvas.height = h;

                var ctx = canvas.getContext('2d');

                // 背景
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 边框
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                var pad = 7 * mmToPx;
                var x = pad;
                var y = pad;

                // Logo
                ctx.fillStyle = '#0ABAB5';
                ctx.font = 'bold ' + (8 * mmToPx) + 'px Arial';
                ctx.fillText('DAFU', x, y + 8 * mmToPx);

                // 货号
                y += 6 * mmToPx;
                ctx.fillStyle = '#1e1e2a';
                ctx.font = 'bold ' + (11 * mmToPx) + 'px Arial';
                ctx.fillText('货号: ' + escapeHtml(data.orderNo), x, y + 11 * mmToPx);

                // 分隔线
                y += 4 * mmToPx;
                ctx.strokeStyle = '#cccccc';
                ctx.setLineDash([1 * mmToPx, 2 * mmToPx]);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y + 1 * mmToPx);
                ctx.lineTo(canvas.width - pad, y + 1 * mmToPx);
                ctx.stroke();
                ctx.setLineDash([]);

                // 金额
                y += 4 * mmToPx;
                ctx.fillStyle = '#0a2a3a';
                ctx.font = 'bold ' + (9 * mmToPx) + 'px Arial';
                ctx.fillText('金额: ' + escapeHtml(data.amount), x, y + 9 * mmToPx);

                // 日期
                y += 3 * mmToPx;
                ctx.fillStyle = '#1e1e2a';
                ctx.font = (5.5 * mmToPx) + 'px Arial';
                ctx.fillText('日期: ' + escapeHtml(data.dateStr), x, y + 5.5 * mmToPx);

                // 分隔线
                y += 3 * mmToPx;
                ctx.strokeStyle = '#cccccc';
                ctx.setLineDash([1 * mmToPx, 2 * mmToPx]);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y + 1 * mmToPx);
                ctx.lineTo(canvas.width - pad, y + 1 * mmToPx);
                ctx.stroke();
                ctx.setLineDash([]);

                // 页码
                var pageY = canvas.height - 6 * mmToPx;
                ctx.fillStyle = '#1a1a1a';
                ctx.globalAlpha = 0.7;
                ctx.font = 'bold ' + (16 * mmToPx) + 'px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('1/1', canvas.width / 2, pageY + 16 * mmToPx);
                ctx.textAlign = 'left';
                ctx.globalAlpha = 1.0;

                // 下载
                var dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                var imgData = dataUrl.split(',')[1];

                var pdfContent = [
                    '%PDF-1.3',
                    '1 0 obj',
                    '<< /Type /Catalog /Pages 2 0 R >>',
                    'endobj',
                    '2 0 obj',
                    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
                    'endobj',
                    '3 0 obj',
                    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 283 425] /Contents 4 0 R /Resources << /ProcSet [/PDF /ImageC] /XObject << /I1 5 0 R >> >> >>',
                    'endobj',
                    '4 0 obj',
                    '<< /Length 66 >>',
                    'stream',
                    'q',
                    '283 0 0 425 0 0 cm',
                    '/I1 Do',
                    'Q',
                    'endstream',
                    'endobj',
                    '5 0 obj',
                    '<< /Type /XObject /Subtype /Image /Width ' + canvas.width + ' /Height ' + canvas.height +
                    ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + imgData.length +
                    ' >>',
                    'stream',
                    imgData,
                    'endstream',
                    'endobj',
                    'xref',
                    '0 6',
                    '0000000000 65535 f',
                    '0000000010 00000 n',
                    '0000000056 00000 n',
                    '0000000111 00000 n',
                    '0000000239 00000 n',
                    '0000000341 00000 n',
                    'trailer',
                    '<< /Size 6 /Root 1 0 R >>',
                    'startxref',
                    '5000',
                    '%%EOF'
                ].join('\n');

                var blob = new Blob([pdfContent], { type: 'application/pdf' });
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = '面单_' + data.orderNo + '.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);

                hideProgress();
                showToast('✅ PDF 下载成功！');
                saveToHistory(data.orderNo, data.amount);
            }

                    safeSetStorage('labelHistory', []);
                    loadHistory();
                    showToast('已清空');
                }
            }

            // ============================================================
            // 进度与Toast
            // ============================================================
            function showProgress(label, subLabel) {
                if (progressLabel) progressLabel.textContent = label || '⏳ 正在处理...';
                if (progressSubLabel) progressSubLabel.textContent = subLabel || '请稍候';
                if (progressOverlay) progressOverlay.classList.add('show');
            }

            function hideProgress() {
                if (progressOverlay) progressOverlay.classList.remove('show');
            }

            var toastTimer = null;

            function showToast(msg) {
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
            }

            // ============================================================
            // 事件绑定与初始化
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                appData.labelHistory = safeGetStorage('labelHistory', []);

                // 绑定事件
                document.querySelectorAll('.nav-tab').forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        var name = this.getAttribute('data-tab');
                        switchTab(name);
                    });
                });

                orderNo.addEventListener('input', function() {
                    if (this.value.trim().length === 0) {
                        this.classList.add('error');
                        $('orderNoError').style.display = 'block';
                    } else {
                        this.classList.remove('error');
                        $('orderNoError').style.display = 'none';
                    }
                    validateForm();
                });

                amount.addEventListener('input', validateForm);

                $('generateBtn').addEventListener('click', generateLabel);
                $('resetBtn').addEventListener('click', resetForm);
                $('backBtn').addEventListener('click', backToCreate);
                $('downloadPdfBtn').addEventListener('click', downloadPdf);
                $('saveBtn').addEventListener('click', savePreview);
                $('clearHistoryBtn').addEventListener('click', clearHistory);

                // 初始化蓝牙
                initBluetooth();

                // 加载历史
                loadHistory();
                showPage('create');
                validateForm();
            });

            // 暴露切换功能
            window.switchTab = switchTab;
        })();
    </script>

</body>
</html>
