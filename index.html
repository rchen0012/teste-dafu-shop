<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>大福面单 · 手机版</title>
    <style>
        /* ===== 全局重置 & 移动优先 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0ABAB5 0%, #008E9B 100%);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            padding: 18px 16px 28px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8f0f0;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-image {
            height: 32px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
        }

        .logo-text h1 {
            font-size: 17px;
            font-weight: 700;
            color: #1e1e2a;
            line-height: 1.2;
        }

        .logo-text .subtitle {
            font-size: 10px;
            color: #888;
            font-weight: 400;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .nav-tab {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            background: #f0f6f6;
            color: #666;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            border: none;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            position: relative;
            z-index: 2;
        }

        .nav-tab:active {
            transform: scale(0.96);
        }

        .nav-tab.active {
            background: #0ABAB5;
            color: #fff;
            box-shadow: 0 4px 10px rgba(10, 186, 181, 0.25);
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
        }
        .page.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== 表单区域 ===== */
        .form-section {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e1e2a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #0ABAB5;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        label .required {
            color: #ff4757;
            margin-left: 2px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0ecec;
            border-radius: 14px;
            font-size: 16px;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
            color: #1e1e2a;
            min-height: 52px;
        }

        input:focus {
            outline: none;
            border-color: #0ABAB5;
            box-shadow: 0 0 0 4px rgba(10, 186, 181, 0.12);
        }

        input.error {
            border-color: #ff4757;
        }

        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* ===== 按钮 ===== */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .btn {
            flex: 1;
            padding: 16px 10px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            touch-action: manipulation;
            min-height: 54px;
            position: relative;
            z-index: 2;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #0ABAB5;
            color: #fff;
            box-shadow: 0 6px 16px rgba(10, 186, 181, 0.25);
        }

        .btn-primary:disabled {
            background: #ccc;
            box-shadow: none;
            transform: none;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e8f0f0;
            color: #0ABAB5;
        }

        .btn-secondary:active {
            background: #d0e6e6;
        }

        .btn-success {
            background: #28a745;
            color: #fff;
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.25);
        }
        .btn-success:active {
            background: #1e7e34;
        }

        /* ===== 预览页面 ===== */
        .preview-page {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preview-header .back-btn {
            background: none;
            border: none;
            color: #0ABAB5;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
            min-height: 44px;
        }
        .preview-header .back-btn:active {
            opacity: 0.6;
        }

        .preview-header .info-badge {
            font-size: 13px;
            color: #666;
            background: #fff;
            padding: 6px 14px;
            border-radius: 30px;
        }

        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 65vh;
            overflow-y: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== 标签预览卡片 ===== */
        .label-card {
            background: #fff;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 16px 18px;
            position: relative;
            font-family: Arial, sans-serif;
            min-height: 150px;
            flex-shrink: 0;
        }

        .label-card .preview-logo1 {
            height: 28px;
            width: auto;
            object-fit: contain;
            display: inline-block;
        }

        .label-card .preview-order {
            font-size: 22px;
            font-weight: bold;
            margin: 6px 0 4px;
            color: #1e1e2a;
        }

        .label-card .preview-divider {
            border-top: 2px dashed #ccc;
            margin: 8px 0;
        }

        .label-card .preview-field {
            font-size: 14px;
            margin: 4px 0;
            color: #1e1e2a;
        }

        .label-card .preview-field.store-field {
            font-size: 20px;
            font-weight: bold;
            color: #0a2a3a;
        }

        .label-card .preview-page-indicator {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            opacity: 0.7;
            text-align: center;
            margin-top: 6px;
        }

        .preview-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .preview-actions .btn {
            flex: 1;
            min-width: 100px;
        }

        /* ===== 历史记录 ===== */
        .history-section {
            background: #f5fafa;
            border-radius: 20px;
            padding: 18px 16px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            border-left: 4px solid #0ABAB5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .history-order {
            font-weight: 600;
            color: #1e1e2a;
            font-size: 15px;
        }

        .history-customer {
            color: #666;
            font-size: 14px;
            margin-top: 2px;
        }

        .history-meta {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e2a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
            z-index: 99999;
            animation: slideDown 0.35s ease;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ===== 打印专用页面 ===== */
        .print-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            z-index: 9999;
            padding: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .print-page.show {
            display: block;
        }

        .print-page .print-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 14px 0;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e8f0f0;
        }

        .print-page .print-toolbar .title {
            font-size: 16px;
            font-weight: 700;
            color: #1e1e2a;
        }

        .print-page .print-toolbar .right-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .print-page .print-toolbar button {
            padding: 10px 18px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            min-height: 44px;
        }

        .print-page .print-toolbar .btn-close {
            background: #e8f0f0;
            color: #0ABAB5;
        }
        .print-page .print-toolbar .btn-close:active {
            background: #d0e6e6;
        }

        .print-page .print-toolbar .btn-print-now {
            background: #0ABAB5;
            color: #fff;
            box-shadow: 0 4px 12px rgba(10, 186, 181, 0.3);
        }
        .print-page .print-toolbar .btn-print-now:active {
            transform: scale(0.96);
            background: #008E9B;
        }

        .print-page .print-label-wrapper {
            display: flex;
            justify-content: center;
            padding: 16px 0 30px 0;
        }

        .print-page .print-label {
            width: 100mm;
            max-width: 100%;
            min-height: 150mm;
            border: 2px solid #000;
            padding: 7mm;
            background: #fff;
            font-family: Arial, sans-serif;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
        }

        .print-page .print-label .preview-logo1 {
            height: 12mm;
            width: auto;
            object-fit: contain;
            display: inline-block;
        }

        .print-page .print-label .preview-order {
            font-size: 11mm;
            font-weight: bold;
            margin: 4mm 0 3mm 0;
            color: #1e1e2a;
        }

        .print-page .print-label .preview-divider {
            border-top: 1mm dashed #ccc;
            margin: 3mm 0;
        }

        .print-page .print-label .preview-field {
            font-size: 5.5mm;
            margin: 2mm 0;
            color: #1e1e2a;
        }

        .print-page .print-label .preview-field.store-field {
            font-size: 9mm;
            font-weight: bold;
            color: #0a2a3a;
            margin: 3mm 0;
        }

        .print-page .print-label .preview-page-indicator {
            position: absolute;
            bottom: 6mm;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16mm;
            font-weight: bold;
            color: #1a1a1a;
            opacity: 0.7;
        }

        .print-page .print-tip {
            text-align: center;
            padding: 14px 16px;
            color: #555;
            font-size: 14px;
            background: #f8fffe;
            border-radius: 12px;
            margin: 0 0 12px 0;
            border: 1px solid #e0f0ee;
            line-height: 1.7;
        }

        .print-page .print-tip strong {
            color: #0ABAB5;
        }

        /* ===== 打印样式 ===== */
        @media print {
            .print-page .print-toolbar,
            .print-page .print-tip {
                display: none !important;
            }
            .print-page {
                background: #fff !important;
                padding: 0 !important;
                position: static !important;
            }
            .print-page .print-label-wrapper {
                padding: 0 !important;
            }
            .print-page .print-label {
                margin: 0 auto;
                border: 2px solid #000;
                page-break-after: always;
                box-shadow: none !important;
                width: 100mm;
                height: 150mm;
            }
            body > .app-container {
                display: none !important;
            }
        }

        /* ===== 工具 ===== */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="logo">
                <img src="images/form-logonova.png" alt="Logo" class="logo-image" onerror="this.style.display='none'">
                <div class="logo-text">
                    <h1>面单打印小程序</h1>
                    <div class="subtitle">DAFU Label Printing System</div>
                </div>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="create">标签</button>
                <button class="nav-tab" data-tab="history">记录</button>
            </div>
        </header>

        <!-- ===== 页面：创建标签 ===== -->
        <div id="pageCreate" class="page active">
            <div class="form-section">
                <div class="section-title">订单信息</div>

                <div class="form-group">
                    <label>货号 <span class="required">*</span></label>
                    <input type="text" id="orderNo" placeholder="输入货号" maxlength="20">
                    <div class="error-message" id="orderNoError">请输入货号</div>
                </div>

                <div class="form-group">
                    <label>金额 <span class="required">*</span></label>
                    <input type="number" id="amount" placeholder="输入金额" step="0.01" min="0">
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="generateBtn">生成标签</button>
                    <button class="btn btn-secondary" id="resetBtn">重置</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面：预览 ===== -->
        <div id="pagePreview" class="page">
            <div class="preview-page">
                <div class="preview-header">
                    <button class="back-btn" id="backBtn">‹ 返回</button>
                    <span class="info-badge" id="previewInfo">1 张</span>
                </div>
                <div class="preview-list" id="previewList">
                    <!-- 动态生成 -->
                </div>
                <div class="preview-actions">
                    <button class="btn btn-success" id="openPrintBtn">🖨️ 打印</button>
                    <button class="btn btn-secondary" id="saveBtn">💾 保存</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面：历史记录 ===== -->
        <div id="pageHistory" class="page">
            <div class="history-section">
                <div class="history-header">
                    <div class="section-title" style="margin-bottom:0;">历史记录</div>
                    <button class="btn btn-secondary" id="clearHistoryBtn" style="padding:8px 16px;font-size:13px;border-radius:30px;">清空</button>
                </div>
                <div class="history-grid" id="historyGrid">
                    <div style="text-align:center;padding:30px 0;color:#999;">暂无记录</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== 打印页面 ===== -->
    <div class="print-page" id="printPage">
        <div class="print-toolbar">
            <span class="title">📄 打印预览</span>
            <div class="right-btns">
                <button class="btn-print-now" id="doPrintBtn">🖨️ 立即打印</button>
                <button class="btn-close" id="closePrintBtn">✕ 关闭</button>
            </div>
        </div>

        <div class="print-tip">
            <span>📱</span> 
            <strong>手机打印方法</strong><br>
            点击 <strong>「立即打印」</strong> → 在系统打印界面选择 <strong>Wi-Fi/蓝牙打印机</strong><br>
            若无打印机，可选择 <strong>「保存为PDF」</strong> 发送到电脑打印
        </div>

        <div class="print-label-wrapper">
            <div class="print-label" id="printLabelContent">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // 全局错误捕获：防止一处报错页面完全卡死
        window.onerror = function(msg, url, line, col, err) {
            console.error('JS错误:', msg, line, col);
            showToast('⚠️ 操作异常，请重试');
            return true;
        };

        // ======================== 数据层 ========================
        let appData = {
            labelHistory: [],
            previewData: {
                orderNo: '',
                amount: '',
                dateStr: ''
            }
        };

        // 安全读取 localStorage
        function safeGetStorage(key, def) {
            try {
                const v = localStorage.getItem(key);
                return v ? JSON.parse(v) : def;
            } catch { return def; }
        }
        function safeSetStorage(key, val) {
            try {
                localStorage.setItem(key, JSON.stringify(val));
            } catch { /* 禁用时静默失败 */ }
        }

        // ======================== DOM 引用 ========================
        const $ = id => document.getElementById(id);
        const orderNo = $('orderNo');
        const amount = $('amount');
        const generateBtn = $('generateBtn');
        const toast = $('toast');
        const printPage = $('printPage');
        const printLabelContent = $('printLabelContent');

        // ======================== 初始化 ========================
        document.addEventListener('DOMContentLoaded', function() {
            appData.labelHistory = safeGetStorage('labelHistory', []);
            bindEvents();
            loadHistory();
            showPage('create');
            validateForm(); // 初始禁用生成按钮
        });

        function bindEvents() {
            // 标签页切换
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const name = tab.getAttribute('data-tab');
                    switchTab(name);
                });
            });

            // 输入验证
            orderNo.addEventListener('input', function() {
                if (this.value.trim().length === 0) {
                    this.classList.add('error');
                    $('orderNoError').style.display = 'block';
                } else {
                    this.classList.remove('error');
                    $('orderNoError').style.display = 'none';
                }
                validateForm();
            });

            amount.addEventListener('input', validateForm);

            // 按钮事件
            $('generateBtn').addEventListener('click', generateLabel);
            $('resetBtn').addEventListener('click', resetForm);
            $('backBtn').addEventListener('click', backToCreate);
            $('openPrintBtn').addEventListener('click', openPrintPage);
            $('saveBtn').addEventListener('click', savePreview);
            $('clearHistoryBtn').addEventListener('click', clearHistory);
            $('doPrintBtn').addEventListener('click', doPrint);
            $('closePrintBtn').addEventListener('click', closePrintPage);
        }

        // ======================== 页面切换 ========================
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = $('page' + page.charAt(0).toUpperCase() + page.slice(1));
            if (target) target.classList.add('active');

            const tabMap = { create: 'create', preview: 'create', history: 'history' };
            const tabName = tabMap[page] || 'create';
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.nav-tab[data-tab="${tabName}"]`)?.classList.add('active');
        }

        function switchTab(tab) {
            if (tab === 'create') showPage('create');
            else if (tab === 'history') { showPage('history'); loadHistory(); }
        }

        function backToCreate() {
            showPage('create');
        }

        // ======================== 表单验证 ========================
        function validateForm() {
            const valid = orderNo.value.trim().length > 0 
                       && amount.value.trim().length > 0 
                       && !isNaN(parseFloat(amount.value)) 
                       && parseFloat(amount.value) >= 0;
            if (generateBtn) generateBtn.disabled = !valid;
            return valid;
        }

        // ======================== 获取日期字符串 ========================
        function getDateStr() {
            const now = new Date();
            const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
            const day = String(now.getDate()).padStart(2,'0');
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            return `${day} ${month} ${year} ${h}:${m}`;
        }

        // ======================== 生成标签 ========================
        function generateLabel() {
            if (!validateForm()) {
                showToast('请完整填写必填信息');
                return;
            }

            const no = orderNo.value.trim();
            const amt = amount.value.trim();

            appData.previewData = { orderNo: no, amount: amt, dateStr: getDateStr() };
            renderPreview();
            showPage('preview');
            showToast('✅ 标签已生成');
        }

        function renderPreview() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            const container = $('previewList');
            $('previewInfo').textContent = `1 张 · ${no}`;

            container.innerHTML = `
                <div class="label-card">
                    <div>
                        <img src="images/preview-logo1.png" alt="DAFU" class="preview-logo1" onerror="this.style.display='none'">
                    </div>
                    <div class="preview-order">货号: ${escapeHtml(no)}</div>
                    <div class="preview-divider"></div>
                    <div class="preview-field store-field">金额: ${escapeHtml(amt)}</div>
                    <div class="preview-field">日期: ${escapeHtml(dateStr)}</div>
                    <div class="preview-divider"></div>
                    <div class="preview-page-indicator">1/1</div>
                </div>
            `;
        }

        function escapeHtml(s) {
            return String(s)
              .replace(/&/g,'&amp;')
              .replace(/</g,'&lt;')
              .replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;')
              .replace(/'/g,'&#039;');
        }

        // ======================== 渲染打印标签 ========================
        function renderPrintLabel() {
            const { orderNo: no, amount: amt, dateStr } = appData.previewData;
            printLabelContent.innerHTML = `
                <div>
                    <img src="images/preview-logo1.png" alt="DAFU" class="preview-logo1" onerror="this.style.display='none'">
                </div>
                <div class="preview-order">货号: ${escapeHtml(no)}</div>
                <div class="preview-divider"></div>
                <div class="preview-field store-field">金额: ${escapeHtml(amt)}</div>
                <div class="preview-field">日期: ${escapeHtml(dateStr)}</div>
                <div class="preview-divider"></div>
                <div class="preview-page-indicator">1/1</div>
            `;
        }

        // ======================== 打开打印页面 ========================
        function openPrintPage() {
            const { orderNo: no } = appData.previewData;
            if (!no) {
                showToast('请先生成标签');
                return;
            }
            renderPrintLabel();
            printPage.classList.add('show');
            document.body.style.overflow = 'hidden';
            showToast('📄 已打开打印预览');
        }

        // ======================== 关闭打印页面 ========================
        function closePrintPage() {
            printPage.classList.remove('show');
            document.body.style.overflow = '';
        }

        // ======================== 执行打印 ========================
        function doPrint() {
            const ua = navigator.userAgent;
            const isMobile = /Android|iPhone|iPad|iPod/.test(ua);
            const { orderNo: no } = appData.previewData;
            if (!no) { showToast('请先生成标签'); return; }

            try {
                if (isMobile && !window.print) {
                    throw new Error('不支持');
                }
                window.print();
                showToast('🖨️ 正在打开打印...');
            } catch (e) {
                // 降级方案：新窗口
                try {
                    renderPrintLabel();
                    const content = printLabelContent.innerHTML;
                    const win = window.open('', '_blank', 'width=400,height=650,scrollbars=yes');
                    if (!win) { showToast('⚠️ 请允许弹出窗口'); return; }
                    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>面单打印</title><style>
                        *{margin:0;padding:0;box-sizing:border-box}
                        body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;background:#fff;padding:10px}
                        .print-label{width:100mm;max-width:100%;min-height:150mm;border:2px solid #000;padding:7mm;background:#fff;font-family:Arial,sans-serif;position:relative;margin:0 auto}
                        .preview-logo1{height:12mm;width:auto;object-fit:contain;display:inline-block}
                        .preview-order{font-size:11mm;font-weight:bold;margin:4mm 0 3mm 0;color:#1e1e2a}
                        .preview-divider{border-top:1mm dashed #ccc;margin:3mm 0}
                        .preview-field{font-size:5.5mm;margin:2mm 0;color:#1e1e2a}
                        .preview-field.store-field{font-size:9mm;font-weight:bold;color:#0a2a3a;margin:3mm 0}
                        .preview-page-indicator{position:absolute;bottom:6mm;left:50%;transform:translateX(-50%);font-size:16mm;font-weight:bold;color:#1a1a1a;opacity:0.7}
                        p{text-align:center;margin:15px 0 5px;font-size:14px;color:#555}
                        @page{size:100mm 150mm;margin:0}
                        @media print{body{padding:0}.print-label{margin:0 auto;border:2px solid #000;box-shadow:none;page-break-after:always}p{display:none}}
                    </style></head><body>
                        <p>请选择浏览器菜单 → 打印 / 导出为PDF</p>
                        <div class="print-label">${content}</div>
                        <script>window.onload=function(){setTimeout(function(){window&&window.print?window.print():null},600)}<\/script>
                    </body></html>`);
                    win.document.close();
                    showToast('📄 新窗口已打开，请打印');
                } catch (err) {
                    showToast('⚠️ 浏览器不支持打印，请截图或分享为PDF');
                }
            }
        }

        // ======================== 保存 ========================
        function savePreview() {
            const { orderNo: no, amount: amt } = appData.previewData;
            if (!no) { showToast('请先生成标签'); return; }
            saveToHistory(no, amt);
            showToast('💾 已保存到历史');
        }

        function saveToHistory(no, amt) {
            const data = {
                id: Date.now(),
                orderNo: no,
                amount: amt,
                createTime: new Date().toLocaleString('zh-CN')
            };
            appData.labelHistory.unshift(data);
            safeSetStorage('labelHistory', appData.labelHistory);
        }

        function resetForm() {
            orderNo.value = '';
            amount.value = '';
            validateForm();
            showToast('🔄 已重置');
        }

        // ======================== 历史记录 ========================
        function loadHistory() {
            const grid = $('historyGrid');
            const history = appData.labelHistory;
            if (history.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:30px 0;color:#999;">暂无记录</div>';
                return;
            }
            grid.innerHTML = history.map(item => `
                <div class="history-card">
                    <div class="history-order">📦 货号: ${escapeHtml(item.orderNo)}</div>
                    <div class="history-customer">💰 金额: ${escapeHtml(item.amount)}</div>
                    <div class="history-meta"><span>${escapeHtml(item.createTime)}</span></div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('确定清空所有历史记录？')) {
                appData.labelHistory = [];
                safeSetStorage('labelHistory', []);
                loadHistory();
                showToast('已清空');
            }
        }

        // ======================== Toast ========================
        let toastTimer = null;
        function showToast(msg) {
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(()=>{ toast.classList.remove('show'); }, 2500);
        }
    </script>

</body>
</html>
